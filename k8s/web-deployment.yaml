apiVersion: apps/v1
kind: Deployment
metadata:
  name: retailops-web
  namespace: retailops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retailops-web
  template:
    metadata:
      labels:
        app: retailops-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/YOUR_GITHUB_OWNER/retailops-web:REPLACE_WITH_GIT_SHA
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            # nginx needs writable temporary paths when read-only root is enabled.
          volumeMounts:
            - name: nginx-tmp
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: retailops-web
  namespace: retailops
spec:
  selector:
    app: retailops-web
  ports:
    - port: 80
      targetPort: http
