apiVersion: apps/v1
kind: Deployment
metadata:
  name: retailops-api
  namespace: retailops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retailops-api
  template:
    metadata:
      labels:
        app: retailops-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/YOUR_GITHUB_OWNER/retailops-api:REPLACE_WITH_GIT_SHA
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: retailops-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: retailops-secrets
                  key: JWT_SECRET_KEY
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retailops-secrets
                  key: ADMIN_PASSWORD
            - name: WAREHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retailops-secrets
                  key: WAREHOUSE_PASSWORD
            - name: CUSTOMER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retailops-secrets
                  key: CUSTOMER_PASSWORD
            - name: ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: retailops-config
                  key: ADMIN_USERNAME
            - name: WAREHOUSE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: retailops-config
                  key: WAREHOUSE_USERNAME
            - name: CUSTOMER_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: retailops-config
                  key: CUSTOMER_USERNAME
            - name: JWT_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: retailops-config
                  key: JWT_EXPIRE_MINUTES
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: retailops-api
  namespace: retailops
spec:
  selector:
    app: retailops-api
  ports:
    - port: 8000
      targetPort: http
